<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0ab"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#f6f5f1"/>

  <!-- User / UI -->
  <rect x="300" y="20" width="360" height="78" rx="12" fill="#ffffff" stroke="#d9772b" stroke-width="1.5"/>
  <text x="480" y="48" fill="#1f2328" font-size="16" font-weight="600" text-anchor="middle">User · Web UI</text>
  <text x="480" y="70" fill="#6b7180" font-size="12" text-anchor="middle">"send 100 USDC to Bob, cheapest, within 10 s"</text>
  <text x="480" y="87" fill="#6b7180" font-size="12" text-anchor="middle">route table · explanation · live status (SSE)</text>

  <line x1="480" y1="98" x2="480" y2="138" stroke="#9aa0ab" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="490" y="123" fill="#6b7180" font-size="11">intent (REST)</text>

  <!-- Router -->
  <rect x="120" y="140" width="720" height="170" rx="14" fill="#ffffff" stroke="#e3e0d8"/>
  <text x="140" y="166" fill="#1f2328" font-size="15" font-weight="600">Intent Router + Relayer (Node.js, off-chain)</text>

  <rect x="140" y="182" width="160" height="110" rx="10" fill="#f1efea"/>
  <text x="220" y="204" fill="#1f2328" font-size="13" font-weight="600" text-anchor="middle">1 · Monitor</text>
  <text x="220" y="226" fill="#6b7180" font-size="11" text-anchor="middle">blocks, base fee</text>
  <text x="220" y="242" fill="#6b7180" font-size="11" text-anchor="middle">txpool backlog</text>
  <text x="220" y="258" fill="#6b7180" font-size="11" text-anchor="middle">health / stall</text>
  <text x="220" y="274" fill="#6b7180" font-size="11" text-anchor="middle">success history</text>

  <rect x="316" y="182" width="160" height="110" rx="10" fill="#f1efea"/>
  <text x="396" y="204" fill="#1f2328" font-size="13" font-weight="600" text-anchor="middle">2 · Quote</text>
  <text x="396" y="226" fill="#6b7180" font-size="11" text-anchor="middle">L2 fee + DA fee</text>
  <text x="396" y="242" fill="#6b7180" font-size="11" text-anchor="middle">latency estimate</text>
  <text x="396" y="258" fill="#6b7180" font-size="11" text-anchor="middle">balance, allowance</text>
  <text x="396" y="274" fill="#6b7180" font-size="11" text-anchor="middle">AMM quote, impact</text>

  <rect x="492" y="182" width="160" height="110" rx="10" fill="#f1efea" stroke="#d9772b"/>
  <text x="572" y="204" fill="#d9772b" font-size="13" font-weight="600" text-anchor="middle">3 · Route</text>
  <text x="572" y="226" fill="#6b7180" font-size="11" text-anchor="middle">hard constraints</text>
  <text x="572" y="242" fill="#6b7180" font-size="11" text-anchor="middle">weighted score</text>
  <text x="572" y="258" fill="#6b7180" font-size="11" text-anchor="middle">cost · latency · risk</text>
  <text x="572" y="274" fill="#6b7180" font-size="11" text-anchor="middle">explanation</text>

  <rect x="668" y="182" width="156" height="110" rx="10" fill="#f1efea"/>
  <text x="746" y="204" fill="#1f2328" font-size="13" font-weight="600" text-anchor="middle">4 · Sign &amp; relay</text>
  <text x="746" y="226" fill="#6b7180" font-size="11" text-anchor="middle">EIP-712 per rollup</text>
  <text x="746" y="242" fill="#6b7180" font-size="11" text-anchor="middle">pre-flight + submit</text>
  <text x="746" y="258" fill="#6b7180" font-size="11" text-anchor="middle">wait ≤ deadline</text>
  <text x="746" y="274" fill="#6b7180" font-size="11" text-anchor="middle">safe re-route</text>

  <line x1="300" y1="237" x2="314" y2="237" stroke="#9aa0ab" marker-end="url(#arr)"/>
  <line x1="476" y1="237" x2="490" y2="237" stroke="#9aa0ab" marker-end="url(#arr)"/>
  <line x1="652" y1="237" x2="666" y2="237" stroke="#9aa0ab" marker-end="url(#arr)"/>

  <!-- arrows to rollups -->
  <line x1="200" y1="310" x2="170" y2="368" stroke="#e8734a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="310" x2="480" y2="368" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="760" y1="310" x2="790" y2="368" stroke="#5bb174" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="488" y="345" fill="#6b7180" font-size="11">JSON-RPC: monitor · quote · fill(intent, sig, fee)</text>

  <!-- Rollups -->
  <g>
    <rect x="40" y="370" width="270" height="170" rx="12" fill="#ffffff" stroke="#e8734a"/>
    <rect x="40" y="370" width="270" height="4" fill="#e8734a"/>
    <text x="60" y="398" fill="#1f2328" font-size="15" font-weight="600">Rollup A · Optimistic fast</text>
    <text x="60" y="420" fill="#6b7180" font-size="12">1 s blocks · 1.2M gas · DA 30 gwei/B</text>
    <text x="60" y="438" fill="#6b7180" font-size="12">deep AMM pool · 7-day challenge</text>
  </g>
  <g>
    <rect x="345" y="370" width="270" height="170" rx="12" fill="#ffffff" stroke="#4a90d9"/>
    <rect x="345" y="370" width="270" height="4" fill="#4a90d9"/>
    <text x="365" y="398" fill="#1f2328" font-size="15" font-weight="600">Rollup B · ZK batch</text>
    <text x="365" y="420" fill="#6b7180" font-size="12">4 s blocks · 4M gas · DA 5 gwei/B</text>
    <text x="365" y="438" fill="#6b7180" font-size="12">shallow pool, better price · validity proof</text>
  </g>
  <g>
    <rect x="650" y="370" width="270" height="170" rx="12" fill="#ffffff" stroke="#5bb174"/>
    <rect x="650" y="370" width="270" height="4" fill="#5bb174"/>
    <text x="670" y="398" fill="#1f2328" font-size="15" font-weight="600">Rollup C · Appchain</text>
    <text x="670" y="420" fill="#6b7180" font-size="12">2 s blocks · 0.9M gas · DA 12 gwei/B</text>
    <text x="670" y="438" fill="#6b7180" font-size="12">alt-DA committee (extra trust)</text>
  </g>
  <!-- contracts row inside each rollup -->
  <g font-size="11" fill="#1f2328">
    <rect x="58" y="456" width="234" height="66" rx="8" fill="#f1efea"/>
    <text x="70" y="476">IntentSettlement (EIP-712, nonces,</text>
    <text x="70" y="492">deadline, maxFee, relayers, pause)</text>
    <text x="70" y="510" fill="#6b7180">MiniAMM · USDC · WETH</text>
    <rect x="363" y="456" width="234" height="66" rx="8" fill="#f1efea"/>
    <text x="375" y="476">IntentSettlement (EIP-712, nonces,</text>
    <text x="375" y="492">deadline, maxFee, relayers, pause)</text>
    <text x="375" y="510" fill="#6b7180">MiniAMM · USDC · WETH</text>
    <rect x="668" y="456" width="234" height="66" rx="8" fill="#f1efea"/>
    <text x="680" y="476">IntentSettlement (EIP-712, nonces,</text>
    <text x="680" y="492">deadline, maxFee, relayers, pause)</text>
    <text x="680" y="510" fill="#6b7180">MiniAMM · USDC · WETH</text>
  </g>
</svg>
